[project]
name = "margin-data-storyteller"
version = "0.1.0"
description = "Cleans a table of data, shows every change it made, and tells the story in it with charts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Waddah Ali" }]
# Planned agents are never uploaded; remove this line when the agent is ready to publish.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "margin-core>=0.1.2,<0.2",  # 0.1.2: agents can ask questions (ctx.ask)
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=15",
]

[project.urls]
Homepage = "https://github.com/Waddah0-0/margin"
Source = "https://github.com/Waddah0-0/margin/tree/main/agents/data_storyteller"
Issues = "https://github.com/Waddah0-0/margin/issues"

[project.entry-points."margin.agents"]
data-storyteller = "data_storyteller.agent:DataStorytellerAgent"

[tool.margin]
id = "data-storyteller"
stage = "planned"
# Turn on mirroring once the agent does real work (and set stage to "experimental"):
# mirror = "<owner>/margin-data-storyteller"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_storyteller"]
